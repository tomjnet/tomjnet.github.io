name: CI/CD

# CI: every pull request and push gets type-checked and built.
# CD: pushes to main (and manual runs) are deployed to GitHub Pages.
# Posts and research are fetched from the content repo at build time, so every deploy picks up new content.
# daily-rebuild.yml also calls this workflow once a day, so scheduled posts go live on their date.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # <user>.github.io repos are served at "/", other repos at "/<repo>".
      - name: Compute site URL and base path
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "SITE=https://${owner}.github.io" >> "$GITHUB_ENV"
          if [ "${repo,,}" = "${owner}.github.io" ]; then
            echo "BASE=/" >> "$GITHUB_ENV"
          else
            echo "BASE=/${repo}" >> "$GITHUB_ENV"
          fi

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify expected pages exist
        run: |
          for page in index.html posts/index.html posts/view/index.html research/index.html hobbies/index.html robots.txt sitemap-index.xml og-image.png; do
            test -f "dist/$page" || { echo "::error::Missing dist/$page"; exit 1; }
          done

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
